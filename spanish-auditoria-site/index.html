<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244d85">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Spanish Auditoría</title>
<link rel="stylesheet" href="https://pgtrdfukjkigvmsrcxlr.supabase.co/functions/v1/spanish-auditoria-style?v=24">
<style>
*,*::before,*::after{box-sizing:border-box}
.hide{display:none!important}
body{margin:0;background:#f4f6f8;color:#111827;font:14px system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid #e5e7eb}
header h1{margin:0;font-size:21px;font-weight:800}
.wrap{max-width:1200px;margin:auto;padding:18px 16px 112px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;gap:4px;padding:8px;background:white;border-top:1px solid #e5e7eb}
nav button{flex:1;min-height:52px}
#auth{max-width:470px;margin:12vh auto 0;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:18px}
button{cursor:pointer}

@media (min-width:850px){#nav{position:fixed!important;top:0!important;bottom:0!important;left:0!important;right:auto!important;width:195px!important;display:flex!important;flex-direction:column!important;justify-content:flex-start!important;gap:5px!important;padding:76px 9px 12px!important;border-top:0!important;border-right:1px solid #e5e7eb!important;overflow-x:hidden!important;overflow-y:auto!important}#nav.hide{display:none!important}#nav button{flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:45px!important;padding:9px 10px!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:9px!important;text-align:left!important;white-space:nowrap!important;font-size:13px!important;line-height:1.2!important}#nav button .navico{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 22px!important;width:22px!important;height:22px!important;font-size:17px!important;line-height:1!important}#nav button .navico svg,#nav button .navico img{width:19px!important;height:19px!important;max-width:19px!important;max-height:19px!important}#nav button .navtxt{display:inline-block!important;flex:1 1 auto!important;min-width:0!important;font-size:13px!important;line-height:1.25!important;white-space:normal!important;overflow-wrap:normal!important;word-break:normal!important}header{margin-left:195px!important}.wrap{margin-left:195px!important;max-width:calc(100% - 195px)!important;padding-bottom:28px!important}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://pgtrdfukjkigvmsrcxlr.supabase.co/functions/v1/spanish-auditoria-appjs?v=20261112_unified_v198"></script>
<script defer src="https://pgtrdfukjkigvmsrcxlr.supabase.co/functions/v1/spanish-auditoria-appjs-stage-v78?v=25"></script>
</head>
<body>
<header><h1>Spanish Auditoría</h1><button type="button" id="logout" class="hide">Cerrar sesión</button></header>
<div id="auth" aria-live="polite"><h2>Acceso administrativo</h2><p>Preparando acceso por PIN…</p></div>
<div id="app" class="hide"><main class="wrap">
<section id="p-home">
<div class="section-title"><h2>Inicio</h2></div>
<div class="quick-actions"><button type="button" onclick="closeForm()">Registrar cierre de caja</button></div>
<div id="kpis" class="grid kpis"></div>
<div id="recent" class="card"></div>
<div id="salesMonths"></div>
</section>
<section id="p-caja" class="hide">
<div class="section-title"><h2>Control de caja</h2></div>
<div class="row"><label>Desde <input id="from" type="date"></label><label>Hasta <input id="to" type="date"></label></div>
<div id="closes"></div>
</section>
<section id="p-proveedores" class="hide">
<div class="section-title"><h2>Proveedores</h2></div>
<input id="sq" type="search" placeholder="Buscar proveedor" aria-label="Buscar proveedor">
<div id="suppliers"></div>
</section>
<section id="p-iva" class="hide">
<div class="section-title"><h2>IVA y facturación</h2></div>
<div id="billKpis"></div><div id="billMonths"></div>
</section>
<section id="p-sueldos" class="hide">
<div class="section-title"><h2>Liquidaciones</h2></div>
<div id="payTable"></div>
</section>
</main></div>
<nav id="nav" class="hide" aria-label="Navegación">
<button class="active" type="button" onclick="go('home',this)"><span class="navico"></span><span class="navtxt">Inicio</span></button>
<button type="button" onclick="go('caja',this)"><span class="navico"></span><span class="navtxt">Caja</span></button>
<button type="button" onclick="go('proveedores',this)"><span class="navico"></span><span class="navtxt">Proveedores</span></button>
<button type="button" onclick="go('iva',this)"><span class="navico"></span><span class="navtxt">IVA</span></button>
<button type="button" onclick="go('sueldos',this)"><span class="navico"></span><span class="navtxt">Sueldos</span></button>
</nav>
<div id="modal"></div>
<script>window.addEventListener("load",()=>{if(typeof window.supabase==="undefined"){const a=document.getElementById("auth");if(a)a.innerHTML="<h2>Sin conexión con Supabase</h2><p>Revisá internet y recargá la página.</p>";}});</script>

<style>
#saQuickActions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#saQuickActions button{min-height:42px}
#saItemSearch{display:flex;align-items:center;gap:8px;margin:12px 0;padding:8px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
#saItemSearch input{border:0;outline:0;flex:1;min-width:0;font:inherit}
</style>
<script>
/* UI-only enhancement: preserves all original handlers and accounting data. */
(function(){
 function install(){
  const section=document.getElementById('p-proveedores');
  if(section&&!document.getElementById('saQuickActions')){
   const bar=document.createElement('div');bar.id='saQuickActions';
   const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='▦ Cargar comprobante · QR / foto / manual';
   btn.onclick=function(){
    const candidates=[...section.querySelectorAll('button')].filter(b=>/cargar boleta|escanear qr|nuevo comprobante|cargar comprobante/i.test(b.textContent||'')&&!bar.contains(b));
    if(candidates.length){candidates[0].click();return;}
    const search=section.querySelector('#sq');if(search){search.focus();search.scrollIntoView({block:'center'});}
    alert('Elegí el proveedor para cargar el comprobante con QR, foto o manual.');
   };
   bar.appendChild(btn);const title=section.querySelector('.section-title');(title||section).after(bar);
  }
  const modal=document.getElementById('modal');if(!modal)return;
  const targets=[...modal.querySelectorAll('table')].filter(t=>/producto|artículo|cantidad|unidades/i.test((t.querySelector('thead')||t).textContent||''));
  for(const table of targets){
   if(table.dataset.saSearchInstalled)continue;
   const context=table.closest('.card,dialog,.modal')||table.parentElement;
   if(!context||!/vendid|producto|artículo/i.test(context.textContent||''))continue;
   table.dataset.saSearchInstalled='1';
   const box=document.createElement('label');box.id='saItemSearch';box.innerHTML='<span aria-hidden="true">🔍</span><input type="search" placeholder="Buscar producto por nombre" aria-label="Buscar producto vendido">';
   table.before(box);
   const input=box.querySelector('input');
   input.addEventListener('input',()=>{const q=input.value.toLocaleLowerCase('es').trim();for(const row of table.querySelectorAll('tbody tr'))row.hidden=!!q&&!row.textContent.toLocaleLowerCase('es').includes(q);});
  }
 }
 let queued=false;const obs=new MutationObserver(()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;install()},150)});
 document.addEventListener('DOMContentLoaded',()=>{install();obs.observe(document.body,{childList:true,subtree:true})});
})();
</script>
</body>
</html>
