<script id="sa-mobile-bill-visual-v2-script">
(function(){
 function enhanceBillVisual(){
  var root=document.getElementById('modal');if(!root)return;
  var compact=root.querySelector('.manual-bill-compact');
  if(compact){
   var actions=[...compact.children].find(function(x){return x.querySelector&&x.querySelector('button[onclick*="startFiscalQrScanner"]')});
   if(actions){
    actions.classList.add('sa-bill-actions');
    actions.querySelectorAll('button').forEach(function(btn){
     if(btn.dataset.saBillVisual==='1')return;
     var text=(btn.textContent||'').replace(/[▣✎]/g,'').trim(),icon=text.includes('cámara')?'⌗':text.includes('foto')?'▤':'✎';
     btn.innerHTML='<span class="sa-bill-icon" aria-hidden="true">'+icon+'</span><span>'+text+'</span>';
     btn.dataset.saBillVisual='1';
    });
   }
  }
  root.querySelectorAll('.doc-actions button').forEach(function(btn){
   btn.style.setProperty('display','inline-flex','important');
   btn.style.setProperty('align-items','center','important');
   btn.style.setProperty('gap','7px','important');
  });
 }
 var queued=false;
 new MutationObserver(function(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;enhanceBillVisual()})}).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
 document.addEventListener('DOMContentLoaded',enhanceBillVisual);enhanceBillVisual();
})();
</script>

<script>
/* UI-only enhancement: preserves all original handlers and accounting data. */
(function(){
 function install(){
  const modal=document.getElementById('modal');if(!modal)return;
  const targets=[...modal.querySelectorAll('table')].filter(t=>/producto|artículo|cantidad|unidades/i.test((t.querySelector('thead')||t).textContent||''));
  for(const table of targets){
   if(table.dataset.saSearchInstalled)continue;
   const context=table.closest('.card,dialog,.modal')||table.parentElement;
   if(!context||!/vendid|producto|artículo/i.test(context.textContent||''))continue;
   table.dataset.saSearchInstalled='1';
   const box=document.createElement('label');box.id='saItemSearch';box.innerHTML='<span aria-hidden="true">🔍</span><input type="search" placeholder="Buscar producto por nombre" aria-label="Buscar producto vendido">';
   table.before(box);
   const input=box.querySelector('input');
   input.addEventListener('input',()=>{const q=input.value.toLocaleLowerCase('es').trim();for(const row of table.querySelectorAll('tbody tr'))row.hidden=!!q&&!row.textContent.toLocaleLowerCase('es').includes(q);});
  }
 }
 let queued=false;const obs=new MutationObserver(()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;install()},150)});
 document.addEventListener('DOMContentLoaded',()=>{install();obs.observe(document.body,{childList:true,subtree:true})});
})();
</script>

<script>

      el.classList.add('sa-mobile-selection-action');

})();

<script id="sa-payroll-mobile-accessibility-v1-script">
(function(){
 function localDate(v){try{return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}catch(e){return ''}}
 function fridayCarry(w){
  if(!w||String(w.status)==='PAID'||!['OPEN','DUE'].includes(String(w.status))||String(w.source_mode||'')==='LEGACY_CONFIRM')return null;
  var start=String(w.period_start||'').slice(0,10);
  if(!start||new Date(start+'T12:00:00').getDay()!==6)return null;
  var date=typeof addDaysISO==='function'?addDaysISO(start,-1):'';
  if(!date||new Date(date+'T12:00:00').getDay()!==5)return null;
  var people=typeof weeklyPayrolls!=='undefined'?weeklyPayrolls:[];
  var previous=people.filter(function(p){return String(p.employee_id)===String(w.employee_id)&&String(p.status)==='PAID'&&String(p.period_start||'')<=date&&String(p.period_end||'')>=date&&localDate(p.paid_at)===date}).sort(function(a,b){return String(b.period_end||'').localeCompare(String(a.period_end||''))})[0];
  if(!previous||!previous.paid_at)return null;
  var rows=(typeof timeEntries!=='undefined'?timeEntries:[]).filter(function(t){return String(t.employee_id)===String(w.employee_id)&&String(t.work_date||'')===date&&t.clock_out_at&&!t.auto_closed&&Date.parse(t.clock_out_at)>Date.parse(previous.paid_at)});
  if(!rows.length)return null;
  var entries=rows.map(function(t){
   var raw=Math.max(0,Math.round(Number(t.approved_overtime_minutes!=null?t.approved_overtime_minutes:t.overtime_minutes||0)));
   var review=String(t.review_status||'')==='REVIEW';
   var payable=review||raw<15?0:Math.floor((raw+15)/30)*30;
   return {raw:raw,payable:payable,review:review};
  });
  return {date:date,previous:previous,entries:entries,raw:entries.reduce(function(n,x){return n+x.raw},0),minutes:entries.reduce(function(n,x){return n+x.payable},0),review:entries.some(function(x){return x.review})};
 }
 function carryText(c){
  var d=typeof workDateLabel==='function'?workDateLabel(c.date):c.date;
  if(c.review)return d+' · Marcación por revisar; no se sumó automáticamente.';
  if(c.minutes>0)return d+' · '+(c.raw===c.minutes?minsText(c.minutes):(c.raw+' min reales → '+minsText(c.minutes)))+' extra posterior al pago anterior.';
  return d+' · '+c.raw+' min reales; 0 min pagables (no alcanza el mínimo de 15).';
 }
 function enhance(){
  var root=document.getElementById('modal'),sheet=root&&root.querySelector('.sheet');
  if(sheet&&sheet.querySelector('#wpExtraHours,#wpSave')){
   var overlay=sheet.closest('.modal');if(overlay)overlay.classList.add('sa-payroll-detail-overlay');
   sheet.classList.add('sa-payroll-detail-sheet');
   sheet.querySelectorAll('details').forEach(function(d){
    var summary=d.querySelector('summary'),label=(summary&&summary.textContent||'').replace(/\s+/g,' ').trim();
    if(/desglose, observaciones y fichajes/i.test(label)){d.classList.add('sa-payroll-breakdown');d.open=true;if(summary&&!summary.dataset.saLabel){summary.dataset.saLabel='1';summary.setAttribute('aria-label','Desglose semanal: tocar para contraer o volver a abrir')}}
   });
   var field=sheet.querySelector('#wpExtraHours'),payButton=sheet.querySelector('#wpSave');
   if(field&&payButton&&!field.dataset.saFridayCheck){
    field.dataset.saFridayCheck='1';
    var w=(typeof weeklyPayrolls!=='undefined'?weeklyPayrolls:[]).find(function(x){return String(x.id)===String(field.dataset.id)});
    var carry=fridayCarry(w);
    if(carry&&carry.minutes>0&&String(w.overtime_source||'')==='AUTO'){
     var current=Math.max(0,Math.round(Number(w.overtime_minutes||0))),next=current+carry.minutes;
     field.value=(next/60).toFixed(2).replace('.',',').replace(/,00$/,'');
     field.dataset.saFridayCarry=String(carry.minutes);
     var note=document.createElement('div');note.className='sa-friday-carry-note';note.setAttribute('role','note');
     note.innerHTML='<b>Extra del viernes pasado incorporada a la propuesta</b><div>'+carryText(carry)+'</div><div>Extras propias de esta semana: '+minsText(current)+' · Propuesta total: '+minsText(next)+'. Guardá el ajuste antes de liquidar.</div>';
     field.insertAdjacentElement('afterend',note);
     var reasonLabel=document.createElement('label');reasonLabel.setAttribute('for','wpExtraReason');reasonLabel.textContent='Motivo que quedará en el historial';
     reasonLabel.style.cssText='display:block;margin-top:9px;font-weight:650';
     var reason=document.createElement('textarea');reason.id='wpExtraReason';reason.rows=2;reason.value='Incluye extra del viernes '+carry.date+' posterior al pago anterior: '+minsText(carry.minutes)+'.';
     reason.style.cssText='display:block;width:100%;min-height:58px;margin-top:5px;padding:9px;border:1px solid #cbd5e1;border-radius:9px;font:inherit';
     note.insertAdjacentElement('afterend',reasonLabel);reasonLabel.insertAdjacentElement('afterend',reason);
     var outer=field.closest('details');if(outer){outer.open=true;var os=outer.querySelector('summary');if(os)os.setAttribute('aria-label','Ajuste de extras: incluye extra pendiente del viernes anterior')}
     if(typeof weeklyPayCalc==='function')weeklyPayCalc();
    }else if(carry&&carry.raw>0){
     var notice=document.createElement('div');notice.className='sa-friday-carry-note';notice.setAttribute('role','note');notice.innerHTML='<b>Control del viernes pasado</b><div>'+carryText(carry)+'</div>';
     field.insertAdjacentElement('afterend',notice);
    }
   }
  }
  var table=document.getElementById('payTable');if(!table)return;
  table.querySelectorAll('.v5-row').forEach(function(row){
   var open=row.querySelector('[data-v5-open]'),w=open&&typeof weeklyPayrolls!=='undefined'&&weeklyPayrolls.find(function(x){return String(x.id)===String(open.dataset.v5Open)});
   if(!w)return;
   if(!row.querySelector('.sa-v5-overtime')){
    var line=document.createElement('div');line.className='sa-v5-overtime';
    var mins=Number(w.overtime_minutes||0),label=typeof minsText==='function'?minsText(mins):(Math.floor(mins/60)+' h '+(mins%60)+' min');
    line.innerHTML='<span>Horas extra de esta semana</span><strong>'+label+'</strong>';
    var bottom=row.querySelector('.v5-row-bottom');if(bottom)row.insertBefore(line,bottom);else row.appendChild(line);
   }
   var carry=fridayCarry(w);
   if(carry&&!row.querySelector('.sa-v5-friday-carry')){
    var cLine=document.createElement('div');cLine.className='sa-v5-friday-carry';cLine.textContent='Viernes anterior · '+carryText(carry);
    var own=row.querySelector('.sa-v5-overtime'),bottom=row.querySelector('.v5-row-bottom');
    if(own)own.insertAdjacentElement('afterend',cLine);else if(bottom)row.insertBefore(cLine,bottom);else row.appendChild(cLine);
   }
   if(open&&!open.dataset.saActionLabel){open.dataset.saActionLabel='1';open.textContent=w.status==='PAID'?'Ver horas y desglose':'Ver horas y liquidar'}
  });
 }
 var queued=false;
 var observer=new MutationObserver(function(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;enhance()})});
 observer.observe(document.documentElement,{subtree:true,childList:true,characterData:true});
 document.addEventListener('DOMContentLoaded',enhance);
 window.addEventListener('resize',enhance);
 enhance();
})();

</script>
